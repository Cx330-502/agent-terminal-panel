name: Publish VS Code Marketplace

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing GitHub Release to publish, e.g. v1.4.1 (empty builds current ref)'
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: marketplace-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: marketplace-publish

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Expected a stable release tag such as v1.4.1" >&2
              exit 1
            fi
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check and test
        if: ${{ !inputs.release_tag }}
        run: npm run check && npm test

      - name: Package six platform VSIX files
        if: ${{ !inputs.release_tag }}
        run: npm run package

      - name: Download and validate historical Release packages
        if: ${{ inputs.release_tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          directory="releases/v$VERSION"
          gh release download "$RELEASE_TAG" --pattern '*.vsix' --dir "$directory"
          for platform in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            package="$directory/agent-terminal-panel-$VERSION-$platform.vsix"
            unzip -p "$package" extension/package.json | node -e '
              let json = "";
              process.stdin.on("data", chunk => json += chunk);
              process.stdin.on("end", () => {
                const manifest = JSON.parse(json);
                if (manifest.version !== process.env.VERSION ||
                    manifest.publisher !== "Cx330-502" || manifest.name !== "agent-terminal-panel") {
                  throw new Error("Historical VSIX identity/version mismatch");
                }
              });'
          done

      - name: Generate release notes
        if: github.ref_type == 'tag'
        run: node scripts/release-notes.mjs "${{ steps.version.outputs.version }}" release-notes.md

      - name: Publish GitHub Release assets
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(releases/v${{ steps.version.outputs.version }}/*.vsix)
          if [[ ${#packages[@]} -ne 6 ]]; then
            echo "Expected 6 platform packages, found ${#packages[@]}." >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${packages[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "${packages[@]}" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # Marketplace uses tenant-level tokens, not Azure resource subscriptions.
          allow-no-subscriptions: true

      - name: Verify Marketplace publisher access
        env:
          PUBLISHER_ID: Cx330-502
        run: |
          set -euo pipefail
          marketplace_resource="499b84ac-1321-427f-aa17-267ca6975798"
          profile_id="$(az rest \
            --method get \
            --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource "$marketplace_resource" \
            --query id \
            --output tsv)"
          echo "Marketplace profile identity: $profile_id"
          echo "Marketplace profile identity: \`$profile_id\`" >> "$GITHUB_STEP_SUMMARY"

          VSCE_PAT="$(az account get-access-token \
            --resource "$marketplace_resource" \
            --query accessToken \
            --output tsv)"
          echo "::add-mask::$VSCE_PAT"
          export VSCE_PAT
          npx vsce verify-pat "$PUBLISHER_ID"

      - name: Publish platform packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(releases/v${{ steps.version.outputs.version }}/*.vsix)
          if [[ ${#packages[@]} -ne 6 ]]; then
            echo "Expected 6 platform packages, found ${#packages[@]}." >&2
            exit 1
          fi

          VSCE_PAT="$(az account get-access-token \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query accessToken \
            --output tsv)"
          echo "::add-mask::$VSCE_PAT"
          export VSCE_PAT

          for package in "${packages[@]}"; do
            npx vsce publish \
              --skip-duplicate \
              --packagePath "$package"
          done
